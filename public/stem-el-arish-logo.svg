    <g transform="translate(142, 408) rotate(8)">
      <path d="M-7,-26 L7,-26 L19,17 L24,17 L24,25 L5,25 L5,17 L9,17 L7,8 L-7,8 L-9,17 L-5,17 L-5,25 L-24,25 L-24,17 L-19,17 Z M-5,-1 L5,-1 L0,-16 Z"/>
