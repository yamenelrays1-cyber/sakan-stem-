      <path d="M157,279 C147,277 140,272 139,267 C146,267 153,272 157,279 Z"/>
      <path d="M159,277 C158,267 161,259 165,256 C166,263 164,271 159,277 Z"/>
      <path d="M171,293 C160,293 151,289 149,284 C156,283 165,286 171,293 Z"/>
      <path d="M173,291 C171,280 173,272 178,268 C180,275 178,284 173,291 Z"/>
      <path d="M187,306 C176,308 166,305 163,300 C170,298 180,300 187,306 Z"/>
      <path d="M189,304 C186,293 187,284 192,280 C194,287 193,297 189,304 Z"/>
      <path d="M204,318 C193,322 183,320 179,315 C186,312 196,313 204,318 Z"/>
      <path d="M206,316 C202,305 202,296 206,292 C209,299 209,309 206,316 Z"/>
      <path d="M222,328 C211,334 201,333 196,329 C203,325 213,324 222,328 Z"/>
      <path d="M224,326 C218,316 217,307 221,302 C225,309 226,318 224,326 Z"/>
      <path d="M240,338 C230,344 220,345 215,341 C221,336 231,335 240,338 Z"/>
