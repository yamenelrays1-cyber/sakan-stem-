      <path d="M0,-3 L8.5,-3 L12,-6.5"/>
      <circle cx="14" cy="-8.5" r="1.8" fill="#FFFFFF"/>
      <path d="M0,3 L13,3"/>
      <circle cx="15.5" cy="3" r="1.8" fill="#FFFFFF"/>
      <path d="M0,8.5 L6.5,8.5 L10.5,12.5"/>
      <circle cx="12" cy="14" r="1.8" fill="#FFFFFF"/>
      <path d="M3.5,-15 L3.5,15"/>
